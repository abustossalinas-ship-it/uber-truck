<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nueva contraseña — Cubik</title>
  <link rel="icon" href="/brand/logo.png" type="image/png" />
  <link rel="stylesheet" href="/theme.css?v=0.0.128" />
</head>
<body>
  <header class="site-header">
    <img class="brand-logo" src="/brand/logo.png" width="120" height="auto" alt="Cubik" />
    <div class="brand-copy">
      <h1>Cubik</h1>
      <p class="tagline">Nueva contraseña</p>
    </div>
  </header>

  <main style="max-width: 420px; margin: 1.5rem auto; padding: 0 1rem">
    <section class="card auth-panel">
      <h2 id="reset-title">Restablecer contraseña</h2>
      <p id="reset-lead" class="muted">Cargando enlace…</p>
      <form id="form-reset" hidden>
        <label>Nueva contraseña</label>
        <input name="password" type="password" minlength="8" required autocomplete="new-password" data-pw-strength />
        <label>Repetir contraseña</label>
        <input name="password_confirm" type="password" minlength="8" required autocomplete="new-password" />
        <p id="reset-error" class="auth-error" role="alert" hidden></p>
        <button type="submit" id="reset-submit">Guardar y entrar</button>
      </form>
      <p class="muted" style="margin-top: 1rem">
        <a href="/">Volver al inicio</a>
      </p>
    </section>
  </main>

  <script src="/password-policy.js?v=0.0.128" defer></script>
  <script src="/password-strength-ui.js?v=0.0.128" defer></script>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    const title = document.getElementById('reset-title');
    const lead = document.getElementById('reset-lead');
    const form = document.getElementById('form-reset');
    const errEl = document.getElementById('reset-error');
    const submitBtn = document.getElementById('reset-submit');

    function showError(msg) {
      errEl.textContent = msg;
      errEl.hidden = false;
    }

    async function init() {
      if (!token) {
        title.textContent = 'Enlace inválido';
        lead.textContent = 'Falta el token. Solicita un nuevo correo desde «Olvidé mi contraseña».';
        return;
      }
      try {
        const res = await fetch(
          '/api/auth/reset-password/verify?token=' + encodeURIComponent(token)
        );
        const json = await res.json();
        if (!res.ok || !json.valid) {
          title.textContent = 'Enlace expirado';
          lead.textContent =
            json.error || 'El enlace ya no es válido. Pide uno nuevo desde la pantalla de ingreso.';
          return;
        }
        title.textContent = 'Elige tu nueva contraseña';
        lead.textContent = 'Mínimo 8 caracteres, con letra, mayúscula y número. El enlace vence en 1 hora.';
        form.hidden = false;
      } catch (e) {
        title.textContent = 'Error';
        lead.textContent = 'No se pudo validar el enlace. Intenta más tarde.';
      }
    }

    form?.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.hidden = true;
      const fd = new FormData(form);
      const password = fd.get('password');
      const confirm = fd.get('password_confirm');
      if (password !== confirm) {
        showError('Las contraseñas no coinciden.');
        return;
      }
      if (typeof PasswordPolicy !== 'undefined') {
        const policy = PasswordPolicy.validate(password);
        if (!policy.ok) {
          showError(policy.error);
          return;
        }
      }
      submitBtn.disabled = true;
      submitBtn.textContent = 'Guardando…';
      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const json = await res.json();
        if (!res.ok) {
          showError(json.error || 'No se pudo guardar');
          return;
        }
        alert(json.message || 'Contraseña actualizada.');
        location.href = '/';
      } catch (err) {
        showError('No se pudo conectar con el servidor.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Guardar y entrar';
      }
    });

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
