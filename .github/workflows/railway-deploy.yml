# Railway ya despliega automáticamente desde GitHub (Settings → Source → main).
# Este job solo confirma el push; NO llama al deploy hook (evita "run failed" por curl).
name: Post-push check

on:
  push:
    branches: [main]

jobs:
  ok:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy vía Railway GitHub
        run: |
          echo "Deploy automático: Railway está conectado al repo (no hace falta deploy hook)."
          echo "Si el deploy falla, revisa Railway → Deployments, no este workflow."
