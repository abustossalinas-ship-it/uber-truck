<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none" aria-hidden="true">
  <defs>
    <path id="motionPath" d="M 48 188 C 72 158, 98 128, 128 102 C 158 76, 198 52, 248 36 C 288 24, 332 18, 360 16"/>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <use href="#motionPath" stroke="#06b6d4" stroke-width="3" stroke-opacity="0.5" stroke-dasharray="10 8" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.6s" repeatCount="indefinite"/>
  </use>
  <g filter="url(#glow)">
    <g>
      <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
        <mpath href="#motionPath"/>
      </animateMotion>
      <rect x="-11" y="-5" width="18" height="8" rx="2" fill="#22d3ee"/>
      <rect x="4" y="-4" width="8" height="6" rx="1.5" fill="#0f172a"/>
      <circle cx="-5" cy="5" r="2.5" fill="#0f172a" stroke="#22d3ee" stroke-width="1"/>
      <circle cx="7" cy="5" r="2.5" fill="#0f172a" stroke="#22d3ee" stroke-width="1"/>
    </g>
  </g>
</svg>
