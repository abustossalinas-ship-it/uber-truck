<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 640" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="mapBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1929"/>
      <stop offset="100%" stop-color="#122a38"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="routePath" d="M 195 520 C 210 470, 230 420, 248 380 C 265 345, 275 310, 285 275 C 295 240, 302 205, 310 170 C 318 135, 325 105, 332 78"/>
  </defs>
  <rect width="520" height="640" fill="url(#mapBg)"/>
  <!-- Grid -->
  <g opacity="0.08" stroke="#06b6d4" stroke-width="0.5">
    <path d="M0 80 H520 M0 160 H520 M0 240 H520 M0 320 H520 M0 400 H520 M0 480 H520 M0 560 H520"/>
    <path d="M65 0 V640 M130 0 V640 M195 0 V640 M260 0 V640 M325 0 V640 M390 0 V640 M455 0 V640"/>
  </g>
  <!-- Chile silhouette simplified -->
  <path d="M 248 55 L 268 62 L 285 78 L 298 95 L 308 115 L 315 138 L 318 162 L 320 188 L 318 215 L 312 245 L 302 278 L 288 312 L 272 348 L 255 385 L 238 422 L 222 458 L 208 492 L 195 525 L 188 555 L 182 585 L 178 610 L 172 628 L 165 638 L 158 628 L 152 605 L 148 575 L 145 540 L 142 500 L 140 458 L 138 415 L 136 372 L 135 330 L 136 290 L 140 252 L 148 215 L 158 180 L 170 148 L 185 120 L 202 95 L 220 75 L 235 62 Z" fill="#164e63" opacity="0.35" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.25"/>
  <!-- Route glow -->
  <use href="#routePath" stroke="#06b6d4" stroke-width="8" stroke-opacity="0.15" fill="none" filter="url(#glow)"/>
  <use href="#routePath" stroke="#06b6d4" stroke-width="3" stroke-opacity="0.85" fill="none" stroke-linecap="round" stroke-dasharray="6 4">
    <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/>
  </use>
  <!-- Cities -->
  <circle cx="195" cy="520" r="6" fill="#06b6d4" opacity="0.3"/>
  <circle cx="195" cy="520" r="3" fill="#06b6d4"/>
  <text x="175" y="545" fill="#94a3b8" font-size="11" font-family="Inter, sans-serif">Concepci�n</text>
  <circle cx="332" cy="78" r="6" fill="#10b981" opacity="0.3"/>
  <circle cx="332" cy="78" r="3" fill="#10b981"/>
  <text x="312" y="68" fill="#94a3b8" font-size="11" font-family="Inter, sans-serif">Santiago</text>
  <!-- Animated truck -->
  <g filter="url(#glow)">
    <g>
      <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
        <mpath href="#routePath"/>
      </animateMotion>
      <rect x="-14" y="-7" width="22" height="10" rx="2" fill="#06b6d4"/>
      <rect x="4" y="-5" width="10" height="8" rx="1.5" fill="#0f172a"/>
      <circle cx="-6" cy="5" r="3.5" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
      <circle cx="8" cy="5" r="3.5" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
    </g>
  </g>
</svg>
